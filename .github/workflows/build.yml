name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for AWS OIDC (no long-lived AWS keys in GitHub)

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # Windows 10/11
          - python: "3.12"
            suffix: ""
          # Windows 7/8 (last Python that supports them)
          - python: "3.8"
            suffix: "-Windows7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install "pyinstaller<7" -r requirements.txt
          # --collect-data bundles the theme files inside the exe (no internet needed)
          pyinstaller --noconfirm --onefile --windowed --name Yingjia --icon assets/yingjia.ico --paths src --collect-data sv_ttk src/run.py
      - name: Package
        shell: pwsh
        run: |
          $name = "Yingjia${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force out | Out-Null
          # Writes the English and Chinese guides into guide/
          python src/yingjia/guide.py guide
          Copy-Item dist/Yingjia.exe "out/$name.exe"
          # Portable zip: data is kept next to the exe (USB stick friendly)
          New-Item -ItemType Directory -Force "portable/$name" | Out-Null
          Copy-Item dist/Yingjia.exe "portable/$name/Yingjia.exe"
          Copy-Item guide/*.txt "portable/$name/"
          "Data is saved in the 'data' folder next to Yingjia.exe." | Out-File "portable/$name/portable.txt"
          Compress-Archive -Path "portable/$name" -DestinationPath "out/$name-USB.zip"
      - name: Build installer (adds a desktop icon)
        if: matrix.suffix == ''
        shell: pwsh
        run: |
          # Inno Setup 6.5+ includes the Simplified Chinese wizard text.
          choco install innosetup -y --no-progress
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\yingjia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Yingjia${{ matrix.suffix }}
          path: out/*

  version:
    # Bump the number in the VERSION file and push to main to publish a new release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already released; skipping"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    # Creates the tag and a GitHub Release page with the .exe downloads.
    if: needs.version.outputs.new == 'true'
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write checksums and download guide
        run: |
          (cd out && sha256sum * > checksums.txt)
          sed "s/{{TAG}}/${{ needs.version.outputs.tag }}/g" .github/release-notes.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: 赢家 Yingjia ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Main download first, so it's at the top of the file list.
          files: |
            out/Yingjia-Setup.exe
            out/Yingjia.exe
            out/Yingjia-USB.zip
            out/Yingjia-Windows7.exe
            out/Yingjia-Windows7-USB.zip
            out/checksums.txt
          body_path: notes.md

  publish:
    # Optional Hong Kong S3 mirror for China: runs with each new release, once the AWS settings below exist.
    if: needs.version.outputs.new == 'true' && vars.AWS_ROLE_ARN != ''
    needs: [build, version]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          (cd out && sha256sum * > checksums.txt)
          aws s3 cp out/ "s3://${{ vars.S3_BUCKET }}/releases/${VERSION}/" --recursive
          aws s3 cp out/ "s3://${{ vars.S3_BUCKET }}/latest/" --recursive \
            --cache-control "max-age=300"
          sed "s/{{VERSION}}/${VERSION}/g" site/index.html > index.html
          aws s3 cp index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "max-age=300"
