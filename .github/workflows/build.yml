name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for AWS OIDC (no long-lived AWS keys in GitHub)

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # Windows 10/11
          - python: "3.12"
            suffix: ""
          # Windows 7/8 (last Python that supports them)
          - python: "3.8"
            suffix: "-win7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install "pyinstaller<7" -r requirements.txt
          # --collect-data bundles the theme files inside the exe (no internet needed)
          pyinstaller --noconfirm --onefile --windowed --name Yingjia --paths src --collect-data sv_ttk src/run.py
      - name: Package
        shell: pwsh
        run: |
          $name = "Yingjia${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/Yingjia.exe "out/$name.exe"
          # Portable zip: data is kept next to the exe (USB stick friendly)
          New-Item -ItemType Directory -Force "portable/$name" | Out-Null
          Copy-Item dist/Yingjia.exe "portable/$name/Yingjia.exe"
          "Data is saved in the 'data' folder next to Yingjia.exe." | Out-File "portable/$name/portable.txt"
          Compress-Archive -Path "portable/$name" -DestinationPath "out/$name-portable.zip"
          Get-ChildItem out -Exclude *.sha256 | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Out-File -Encoding ascii "out/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Yingjia${{ matrix.suffix }}
          path: out/*

  release:
    # Tag a version (e.g. v1.0.0) to get a download page on GitHub Releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  publish:
    # Optional Hong Kong S3 mirror for China: only on version tags, and only once the AWS settings below exist.
    if: startsWith(github.ref, 'refs/tags/v') && vars.AWS_ROLE_ARN != ''
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        run: |
          VERSION="${GITHUB_REF_NAME}"
          aws s3 cp out/ "s3://${{ vars.S3_BUCKET }}/releases/${VERSION}/" --recursive
          aws s3 cp out/ "s3://${{ vars.S3_BUCKET }}/latest/" --recursive \
            --cache-control "max-age=300"
          sed "s/{{VERSION}}/${VERSION}/g" site/index.html > index.html
          aws s3 cp index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "max-age=300"
