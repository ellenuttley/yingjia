name: Probe
on:
  push:
    branches: [probe-hang]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/hangprobe.py
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
      - name: full self-test piped
        if: false
        run: python -c "import subprocess,sys; r=subprocess.run([sys.executable,'-m','yingjia.selftest'],timeout=120,capture_output=True,text=True,errors='replace'); print(r.stdout[-3000:], r.stderr[-3000:])"
        env:
          PYTHONPATH: src
        continue-on-error: true
      - name: full self-test direct, no faulthandler
        run: python -m yingjia.selftest
        timeout-minutes: 4
        continue-on-error: true
        env:
          PYTHONPATH: src
          NO_FH: "1"
