name: Probe
on:
  push:
    branches: [probe-hang]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/hangprobe.py
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
